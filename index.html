      {view === "recaps" && !entering && !profileFor && <div>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <span className="section-heading">Round recaps</span>
          <button onClick={() => {
            const nextRoundLock = (data.lockedRounds || {})[roundCount + 1];
            const baseForm = nextRoundLock && nextRoundLock.courseId ? { ...emptyForm, course: String(nextRoundLock.courseId) } : { ...emptyForm };
            const lockedTeams = nextRoundLock && nextRoundLock.teams ? nextRoundLock.teams : null;
            const teams = lockedTeams || suggestedTeams;
            if (isTeamRound && teams) setForm({ ...baseForm, teamA: teams.A || [], teamB: teams.B || [] });
            else setForm(baseForm);
            setEntering(true);
          }} style={{ fontSize: 12, padding: "5px 12px", cursor: "pointer", background: COL.navy, color: COL.w, border: "none", borderRadius: 6 }}>+ R{roundCount + 1}{isTeamRound ? " TEAMS" : ""}</button>
        </div>
        {!(data.rounds || []).length && <div style={{ fontSize: 12, color: COL.sil, textAlign: "center", padding: "2rem 0" }}>No rounds yet.</div>}
        {[...(data.rounds || [])].reverse().map((r, revI) => {
          const idx = (data.rounds || []).length - 1 - revI;
          return (
          <div key={r.num} className="tracker-card" style={{ marginBottom: 10, overflow: "hidden" }}>
            <div style={{ background: "rgba(255,255,255,.04)", padding: "8px 12px", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, borderBottom: "1px solid rgba(143,161,196,.16)" }}>
              <div><span style={{ fontSize: 11, fontWeight: 500, color: COL.gold }}>R{r.num}</span><span style={{ fontSize: 13, fontWeight: 500, color: COL.w, marginLeft: 6 }}>{r.courseName}</span></div>
              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <span style={{ fontSize: 10, color: COL.sil }}>{r.date}</span>
                <button onClick={() => editRound(idx)} style={{ fontSize: 9, padding: "3px 8px", background: "#ffffff15", color: COL.w, border: "1px solid #ffffff25", borderRadius: 4, cursor: "pointer", fontWeight: 500 }}>Edit</button>
                <button onClick={() => deleteRound(idx)} title="Delete round" style={{ fontSize: 11, padding: "3px 7px", background: "#ffffff10", color: "#ff9999", border: "1px solid #ffffff20", borderRadius: 4, cursor: "pointer", lineHeight: 1 }}>×</button>
              </div>
            </div>
            {r.isTeam ? (
              <div style={{ padding: "10px 12px" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                  <span style={{ display: "inline-flex", alignItems: "center", gap: 5, background: COL.gold + "20", color: COL.gold, padding: "3px 8px", borderRadius: 6, fontWeight: 700, fontSize: 9, letterSpacing: 1 }}><UiIcon name="users" size={11} /> TEAM SCRAMBLE</span>
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                  {[
                    { id: "A", players: (r.teams || {}).A || [], color: "#3b82f6" },
                    { id: "B", players: (r.teams || {}).B || [], color: "#a855f7" },
                  ].map(team => {
                    const won = r.winningTeam === team.id;
                    return <div key={team.id} style={{
                      padding: 10, borderRadius: 8,
                      border: won ? `1.5px solid ${COL.grn}` : `1px solid ${COL.red}44`,
                      background: won ? "rgba(78,164,124,.1)" : "rgba(157,72,80,.09)",
                    }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 6 }}>
                        <div style={{ width: 18, height: 18, borderRadius: "50%", background: team.color, color: "#fff", fontSize: 10, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center" }}>{team.id}</div>
                        <span style={{ fontSize: 10, color: won ? COL.grn : COL.red, fontWeight: 700 }}>{won ? "WON · +6 each" : "LOST · −2 each"}</span>
                      </div>
                      <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                        {team.players.map(p => <div key={p} style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 11 }}>
                          <Avatar name={p} size={20} />
                          <span style={{ fontWeight: 500 }}>{shortName(p)}</span>
                        </div>)}
                      </div>
                    </div>;
                  })}
                </div>
              </div>
            ) : (
              <div style={{ display: "grid", gridTemplateColumns: r.winner && !(r.placements && Object.keys(r.placements).length) ? "1fr" : "repeat(4,1fr)" }}>
                {(() => {
                  const entries = Object.entries(r.placements || {});
                  if (!entries.length && r.winner) entries.push([r.winner, 1]);
                  // Sort primarily by position; for tied positions, secondary sort by stableford desc.
                  entries.sort((a, b) => a[1] - b[1] || (((r.scores || {})[b[0]]) || 0) - (((r.scores || {})[a[0]]) || 0));
                  const roundPts = entries.length === 1 && r.winner ? { [r.winner]: PTS[1] } : pointsForRound(r.placements);
                  return entries.map(([p, pos], idx) => {
                    const isLol = r.lollies && r.lollies.winner === p;
                    const isMare = r.mare && r.mare.winner === p;
                    const isLast = idx === entries.length - 1;
                    const winnerOnly = r.winner && !(r.placements && r.placements[p]);
                    return (
                    <div key={p} style={{ padding: "8px 4px", textAlign: "center", borderRight: !isLast ? "1px solid rgba(143,161,196,.14)" : "none", background: pos === 1 ? "rgba(210,169,46,.08)" : "transparent" }}>
                      <Avatar name={p} size={24} />
                      <div style={{ fontSize: 11, fontWeight: 500, marginTop: 3, color: pos === 1 ? COL.gold : COL.w }}>{shortName(p)}</div>
                      <div style={{ fontSize: 10, color: COL.sil }}>{winnerOnly ? "Winner · scorecard pending" : `${placementLabel(r.placements, p)}${(r.scores || {})[p] ? ` - ${r.scores[p]}sf` : ""}`}</div>
                      <div style={{ display: "flex", gap: 2, justifyContent: "center", marginTop: 3 }}>
                        <span style={{ fontSize: 9, padding: "1px 5px", borderRadius: 8, background: "rgba(91,131,255,.14)", color: "#9db6ff", fontWeight: 500 }}>+{roundPts[p] || 0}</span>
                        {isLol && <span style={{ fontSize: 9, padding: "1px 5px", borderRadius: 8, background: COL.gold + "25", color: COL.gold, fontWeight: 500 }}>+1</span>}
                        {isMare && <span style={{ fontSize: 9, padding: "1px 5px", borderRadius: 8, background: COL.red + "25", color: "#eca1a7", fontWeight: 500 }}>-1</span>}
                      </div>
                    </div>);
                  });
                })()}
              </div>
            )}
            <div style={{ padding: "8px 10px" }}>
              {r.lollies && r.lollies.winner && <div className="tracker-soft" style={{ borderColor: `${COL.gold}44`, marginBottom: 6, overflow: "hidden" }}>
                <div style={{ padding: "8px 12px", background: "rgba(210,169,46,.1)", display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontWeight: 500, color: COL.gold, fontSize: 13 }}>LOLLIES!</span>
                  <span className="tracker-chip" style={{ fontSize: 9, padding: "2px 8px" }}>Shot of the day</span>
                  <span style={{ marginLeft: "auto", fontSize: 13, fontWeight: 500, color: COL.gold }}>{shortName(r.lollies.winner)}</span>
                </div>
                {r.lollies.desc && <div style={{ padding: "10px 12px", borderTop: `1px solid ${COL.gold}22`, fontSize: 12, color: COL.w, lineHeight: 1.4 }}>{r.lollies.desc}</div>}
              </div>}
              {r.mare && r.mare.winner && <div className="tracker-soft" style={{ borderColor: `${COL.red}44`, marginBottom: 6, overflow: "hidden" }}>
                <div style={{ padding: "8px 12px", background: "rgba(157,72,80,.12)", display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontWeight: 500, color: COL.red, fontSize: 13 }}>Mare</span>
                  <span style={{ marginLeft: "auto", fontSize: 13, fontWeight: 500, color: COL.red }}>{shortName(r.mare.winner)}</span>
                </div>
                {r.mare.desc && <div style={{ padding: "10px 12px", borderTop: `1px solid ${COL.red}22`, fontSize: 12, color: COL.w, lineHeight: 1.4 }}>{r.mare.desc}</div>}
              </div>}
              {r.ctp && r.ctp.winner && <div className="tracker-soft" style={{ borderColor: `${COL.grn}44`, marginBottom: 6, overflow: "hidden" }}>
                <div style={{ padding: "8px 12px", background: "rgba(78,164,124,.12)", display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ display: "inline-flex", alignItems: "center", gap: 5, fontWeight: 500, color: COL.grn, fontSize: 13 }}><UiIcon name="target" size={12} /> CTP</span>
                  <span className="tracker-chip green" style={{ fontSize: 9, padding: "2px 8px" }}>Closest to the pin · +1 pt</span>
                  <span style={{ marginLeft: "auto", fontSize: 13, fontWeight: 500, color: COL.grn }}>{shortName(r.ctp.winner)}</span>
                </div>
              </div>}
              {r.summary && <div className="tracker-soft" style={{ marginBottom: 6, overflow: "hidden" }}>
                <div className="tracker-kicker" style={{ padding: "6px 12px", background: "rgba(255,255,255,.035)", letterSpacing: 1 }}>Round summary</div>
                <div style={{ padding: "10px 12px", fontSize: 12, color: COL.w, lineHeight: 1.55, whiteSpace: "pre-wrap" }}>{renderRichText(r.summary)}</div>
              </div>}
            </div>
            {(r.photos || []).length > 0 && <div style={{ display: "flex", gap: 3, padding: "0 10px 8px", overflowX: "auto" }}>
              {r.photos.map((photo, i) => <img key={i} src={photo} onClick={() => setLightbox({ photos: r.photos, index: i })} style={{ height: 70, borderRadius: 6, objectFit: "cover", cursor: "pointer", flexShrink: 0, transition: "transform 0.15s" }} onMouseEnter={e => e.currentTarget.style.transform = "scale(1.04)"} onMouseLeave={e => e.currentTarget.style.transform = "scale(1)"} alt="" />)}
            </div>}
          </div>
          );
        })}
        {(data.rounds || []).length === 0 && <div style={{ textAlign: "center", marginTop: 24, padding: 24, color: COL.sil, fontSize: 13 }}>No rounds yet. Tap "+ R{roundCount + 1}" above to log the first round.</div>}
      </div>}

      {/* ===== ROUND ENTRY ===== */}
      {view === "recaps" && entering && !profileFor && <div>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <span className="section-heading">{editingIdx !== null ? `Editing Round ${formRoundNum}` : `Round ${roundCount + 1}`}</span>
          <button onClick={() => { setEntering(false); setEditingIdx(null); setForm(emptyForm); }} style={{ fontSize: 12, padding: "6px 14px" }}>Cancel</button>
        </div>

        <label className="tracker-kicker" style={{ display: "block", marginBottom: 6 }}>Course</label>
        <select value={form.course} onChange={e => setForm({ ...form, course: e.target.value })} style={{ width: "100%", padding: "10px 12px", fontSize: 13, marginBottom: 14 }}>
          <option value="">Select...</option>
          {courseOptionIds.filter(cid => !(data.rounds || []).some((r, i) => r.courseId === cid && i !== editingIdx)).map(cid => { const c = allCourses.find(x => x.id === cid); return c ? <option key={cid} value={cid}>{c.n} - ${c.f}</option> : null; })}
        </select>

        {formIsTeam ? (
          <div style={{ marginBottom: 8 }}>
            <div style={{ fontSize: 11, color: COL.sil, marginBottom: 8, fontWeight: 500, display: "flex", alignItems: "center", gap: 8 }}>
              <span className="tracker-chip gold">Team scramble</span>
              <span style={{ color: COL.sil, fontWeight: 400 }}>R{formRoundNum} · 1st+4th vs 2nd+3rd</span>
            </div>
            <div style={{ fontSize: 10, color: COL.sil, marginBottom: 10, lineHeight: 1.4 }}>Tap a player to swap teams. Winning team: <strong style={{ color: COL.grn }}>+6 each</strong>. Losing team: <strong style={{ color: COL.red }}>-2 each</strong>.</div>
            {[
              { id: "A", players: form.teamA, color: "#3b82f6" },
              { id: "B", players: form.teamB, color: "#a855f7" },
            ].map(team => (
              <div key={team.id} onClick={() => setForm({ ...form, winningTeam: team.id })} style={{
                marginBottom: 8, padding: 12, borderRadius: 10, cursor: "pointer",
                border: form.winningTeam === team.id ? `1.5px solid ${COL.grn}` : "1px solid rgba(143,161,196,.2)",
                background: form.winningTeam === team.id ? "rgba(78,164,124,.1)" : "rgba(17,32,54,.72)",
              }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                  <div style={{ width: 22, height: 22, borderRadius: "50%", background: team.color, color: "#fff", fontSize: 11, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center" }}>{team.id}</div>
                  <span style={{ fontSize: 13, fontWeight: 600 }}>Team {team.id}</span>
                  {form.winningTeam === team.id && <span style={{ marginLeft: "auto", fontSize: 10, fontWeight: 700, color: COL.grn, padding: "3px 8px", background: COL.grn + "15", borderRadius: 6 }}>✓ WINNERS · +6 each</span>}
                  {form.winningTeam && form.winningTeam !== team.id && <span style={{ marginLeft: "auto", fontSize: 10, fontWeight: 700, color: COL.red, padding: "3px 8px", background: COL.red + "15", borderRadius: 6 }}>−2 each</span>}
                </div>
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                  {team.players.map(p => (
                    <div key={p} onClick={(e) => {
                      e.stopPropagation();
                      const otherKey = team.id === "A" ? "teamB" : "teamA";
                      const myKey = team.id === "A" ? "teamA" : "teamB";
                      setForm({
                        ...form,
                        [myKey]: form[myKey].filter(x => x !== p),
                        [otherKey]: [...form[otherKey], p],
                      });
                    }} style={{ display: "flex", alignItems: "center", gap: 6, padding: "6px 10px", background: "rgba(255,255,255,.055)", border: "1px solid rgba(143,161,196,.2)", borderRadius: 16, fontSize: 12, fontWeight: 500, cursor: "pointer" }}>
                      <Avatar name={p} size={20} />
                      <span>{shortName(p)}</span>
                    </div>
                  ))}
                </div>
              </div>
            ))}
            <button onClick={() => suggestedTeams && setForm({ ...form, teamA: suggestedTeams.A, teamB: suggestedTeams.B })} style={{ fontSize: 10, padding: "5px 12px", background: "transparent", color: COL.sil, border: "1px solid rgba(143,161,196,.22)", borderRadius: 6, cursor: "pointer", textDecoration: "none", marginTop: 2 }}>↻ Reset to suggested pairing</button>
          </div>
        ) : (<>
          <label className="tracker-kicker" style={{ display: "block", marginBottom: 4 }}>Stableford <span style={{ color: COL.sil, fontWeight: 400, letterSpacing: 0, textTransform: "none" }}>(net points from 18Birdies)</span></label>
          <div style={{ fontSize: 9, color: COL.sil, marginBottom: 8 }}>Position auto-calculated from SF. Equal SF = tied position, both get full points.</div>
          {(() => {
            const livePlacements = derivePlacements(form.scores || {});
            return PLAYERS.map(player => {
              const sf = (form.scores || {})[player];
              const pos = livePlacements[player];
              const tied = pos && Object.values(livePlacements).filter(v => v === pos).length > 1;
              const playerPts = pos ? PTS[pos] || 0 : 0;
              return <div key={player} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                <div style={{ width: 100, fontSize: 12, fontWeight: 500, color: COL.w, display: "flex", alignItems: "center", gap: 6 }}>
                  <Avatar name={player} size={22} />
                  <span>{shortName(player)}</span>
                </div>
                <input type="number" placeholder="Stableford" value={sf || ""} onChange={e =>
                  setForm({ ...form, scores: { ...form.scores, [player]: parseInt(e.target.value) || 0 } })
                } style={{ flex: 1, padding: "9px 10px", fontSize: 13, textAlign: "center" }} />
                <div style={{ width: 60, textAlign: "center" }}>
                  <div style={{ fontSize: 11, fontWeight: 600, color: pos === 1 ? COL.gold : pos === 4 ? COL.sil : COL.w }}>
                    {pos ? (tied ? "T" : "") + (pos === 1 ? "1st" : pos === 2 ? "2nd" : pos === 3 ? "3rd" : "4th") : "-"}
                  </div>
                  <div style={{ fontSize: 10, color: tied ? COL.gold : "#8fa1c4", fontWeight: 500 }}>{pos ? `+${playerPts}` : ""}</div>
                </div>
              </div>;
            });
          })()}
        </>)}

        {/* Photos */}
        <div className="tracker-soft" style={{ margin: "8px 0", padding: 10, borderStyle: "dashed", cursor: "pointer" }} onClick={() => fileRef.current && fileRef.current.click()}>
          <input ref={fileRef} type="file" accept="image/*" multiple onChange={handlePhotos} style={{ display: "none" }} />
          {!form.photos.length ? <div style={{ textAlign: "center" }}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style={{ margin: "0 auto 3px" }}><rect x="3" y="5" width="18" height="14" rx="2" stroke={COL.sil} strokeWidth="1.5" /><circle cx="8.5" cy="10.5" r="1.5" stroke={COL.sil} strokeWidth="1.5" /><path d="M3 16l5-5 4 4 3-3 6 6" stroke={COL.sil} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" /></svg>
            <div style={{ fontSize: 10, color: COL.sil }}>Add scorecards + round photos (max {MAX_PHOTOS})</div>
          </div> : <>
            <div style={{ fontSize: 10, color: COL.sil, marginBottom: 6, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span>{form.photos.length} of {MAX_PHOTOS} photos</span>
              {form.photos.length < MAX_PHOTOS && <span style={{ color: COL.gold, fontWeight: 500 }}>Tap to add more</span>}
            </div>
            <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 4 }}>
              {form.photos.map((ph, i) => <div key={i} style={{ position: "relative", flexShrink: 0 }}>
                <img src={ph} style={{ height: 60, borderRadius: 4 }} alt="" />
                <button onClick={e => { e.stopPropagation(); const arr = [...form.photos]; arr.splice(i, 1); setForm({ ...form, photos: arr }); }} style={{ position: "absolute", top: -4, right: -4, width: 16, height: 16, borderRadius: "50%", background: COL.red, color: COL.w, border: "none", fontSize: 10, cursor: "pointer", lineHeight: "16px", padding: 0 }}>×</button>
              </div>)}
              {form.photos.length < MAX_PHOTOS && <div style={{ width: 60, height: 60, borderRadius: 4, border: "1px dashed rgba(143,161,196,.36)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22, color: COL.sil, flexShrink: 0 }}>+</div>}
            </div>
          </>}
        </div>

        {/* LOLLIES - single winner, 4 lads agreed post-round */}
        <div className="tracker-soft" style={{ margin: "10px 0", padding: 14, borderColor: `${COL.gold}44`, background: "rgba(210,169,46,.08)" }}>
          <div style={{ fontSize: 13, fontWeight: 600, color: COL.gold, marginBottom: 2 }}>LOLLIES! Shot of the day</div>
          <div style={{ fontSize: 10, color: COL.sil, marginBottom: 8 }}>Agreed by all 4 post-round</div>
          <select value={form.lolWinner} onChange={e => setForm({ ...form, lolWinner: e.target.value })} style={{ width: "100%", padding: "9px 10px", fontSize: 13, marginBottom: form.lolWinner ? 8 : 0 }}>
            <option value="">No LOLLIES this round</option>
            {PLAYERS.map(p => <option key={p} value={p}>{p}</option>)}
          </select>
          {form.lolWinner && <textarea placeholder={`What did ${shortName(form.lolWinner)} do?`} value={form.lolDesc} onChange={e => setForm({ ...form, lolDesc: e.target.value })} style={{ width: "100%", padding: "9px 10px", fontSize: 12, minHeight: 56 }} />}
        </div>

        {/* Mare - single winner, 4 lads agreed post-round */}
        <div className="tracker-soft" style={{ margin: "0 0 10px", padding: 14, borderColor: `${COL.red}44`, background: "rgba(157,72,80,.08)" }}>
          <div style={{ fontSize: 13, fontWeight: 600, color: COL.red, marginBottom: 8 }}>Mare</div>
          <select value={form.mareWinner} onChange={e => setForm({ ...form, mareWinner: e.target.value })} style={{ width: "100%", padding: "9px 10px", fontSize: 13, marginBottom: form.mareWinner ? 8 : 0 }}>
            <option value="">No Mare this round</option>
            {PLAYERS.map(p => <option key={p} value={p}>{p}</option>)}
          </select>
          {form.mareWinner && <textarea placeholder="Optional notes" value={form.mareDesc} onChange={e => setForm({ ...form, mareDesc: e.target.value })} style={{ width: "100%", padding: "9px 10px", fontSize: 12, minHeight: 56 }} />}
        </div>

        {/* Closest to the pin - +1 point */}
        <div className="tracker-soft" style={{ margin: "0 0 10px", padding: 14, borderColor: `${COL.grn}44`, background: "rgba(78,164,124,.08)" }}>
          <div style={{ display: "flex", alignItems: "baseline", gap: 6, marginBottom: 2 }}>
            <span style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 13, fontWeight: 600, color: COL.grn }}><UiIcon name="target" size={13} /> Closest to the pin</span>
            <span style={{ fontSize: 10, color: COL.grn, fontWeight: 600, padding: "1px 6px", borderRadius: 4, background: COL.grn + "15" }}>+1 pt</span>
          </div>
          <div style={{ fontSize: 10, color: COL.sil, marginBottom: 8 }}>Closest tee shot to the flag on a designated par 3</div>
          <select value={form.ctpWinner} onChange={e => setForm({ ...form, ctpWinner: e.target.value })} style={{ width: "100%", padding: "9px 10px", fontSize: 13 }}>
            <option value="">No CTP this round</option>
            {PLAYERS.map(p => <option key={p} value={p}>{p}</option>)}
          </select>
        </div>

        {/* Round summary - host writeup */}
        <div className="tracker-soft" style={{ margin: "0 0 12px", padding: 14 }}>
          <div style={{ fontSize: 13, fontWeight: 600, color: COL.w, marginBottom: 2 }}>Round summary</div>
          <div style={{ fontSize: 10, color: COL.sil, marginBottom: 8 }}>A few notes per player. Wrap text in <code style={{ background: "rgba(255,255,255,.08)", padding: "1px 4px", borderRadius: 3, border: "1px solid rgba(143,161,196,.2)", fontSize: 10 }}>**double asterisks**</code> for bold (e.g. player names).</div>
          <textarea placeholder={"**Course conditions**\nGreens slow, dew on the front 9.\n\n**Niall**\nBattled hard but lost the plot on the back 9.\n\n**Sea**\nGot every bunker."} value={form.summary} onChange={e => setForm({ ...form, summary: e.target.value })} style={{ width: "100%", padding: "10px 12px", fontSize: 13, minHeight: 160, fontFamily: "inherit", lineHeight: 1.5 }} />
        </div>

        <button onClick={submitRound} style={{ width: "100%", padding: 14, fontSize: 14, fontWeight: 600, cursor: "pointer", background: COL.navy, color: COL.w, border: "none", borderRadius: 10 }}>{editingIdx !== null ? `Save changes to Round ${formRoundNum}` : `Submit round ${roundCount + 1}`}</button>
      </div>}

      {/* ===== FINALE ===== */}
      {view === "finale" && !profileFor && <div>
        <div className="tracker-card" style={{ padding: "24px 16px 20px", marginBottom: 10, textAlign: "center", color: COL.w, borderColor: `${COL.gold}33` }}>
          <div style={{ fontSize: 10, letterSpacing: 3, color: COL.gold, textTransform: "uppercase", fontWeight: 500 }}>Rounds 11 & 12</div>
          <h2 style={{ fontSize: 32, fontWeight: 500, margin: "10px 0 4px", fontFamily: "Georgia,serif", color: COL.w }}>Barnbougle</h2>
          <div style={{ fontSize: 12, color: COL.sil, marginTop: 2 }}>Bridport, Tasmania</div>
          <div style={{ display: "flex", gap: 12, justifyContent: "center", marginTop: 16, width: "90%", margin: "16px auto 0" }}>
            <div style={{ flex: 1, padding: "12px 8px", borderRadius: 8, background: COL.nm, maxWidth: "45%", flex: "1 1 auto", border: `1px solid ${COL.w}10` }}>
              <div style={{ fontSize: 9, color: COL.sil, letterSpacing: 1 }}>ROUND 11</div>
              <div style={{ fontSize: 16, fontWeight: 500, margin: "4px 0" }}>Lost Farm</div>
              <div style={{ fontSize: 10, color: COL.sil }}>World #23</div>
              <div style={{ fontSize: 9, color: COL.sil }}>Top 100 in the world</div>
            </div>
            <div style={{ flex: 1, padding: "12px 8px", borderRadius: 8, background: COL.gold + "15", maxWidth: "45%", flex: "1 1 auto", border: `1px solid ${COL.gold}40` }}>
              <div style={{ fontSize: 9, color: COL.gold, letterSpacing: 1 }}>ROUND 12 - DECIDER</div>
              <div style={{ fontSize: 16, fontWeight: 500, color: COL.gold, margin: "4px 0" }}>Barnbougle Dunes</div>
              <div style={{ fontSize: 10, color: COL.sil }}>World #11</div>
              <div style={{ fontSize: 9, color: COL.sil }}>Top 20 in the world</div>
            </div>
          </div>
          <div style={{ margin: "16px auto 0", maxWidth: "80%" }}>
            <div style={{ height: 4, background: COL.nm, borderRadius: 2, overflow: "hidden" }}>
              <div style={{ height: "100%", width: `${progressPct}%`, background: `linear-gradient(90deg,${COL.nl},${COL.gold})`, borderRadius: 2 }} />
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 8, color: COL.sil, marginTop: 3 }}>
              <span style={{ fontSize: 10 }}>Victoria</span><span style={{ fontSize: 10 }}>Tasmania</span>
            </div>
          </div>
        </div>

        <div className="section-heading" style={{ marginBottom: 4 }}>Season schedule</div>
        <div style={{ fontSize: 10, color: COL.sil, marginBottom: 8 }}>
          Rounds ideally every 2 weeks on Sat or Sun. Skips weeks where anyone is away. 
          Estimated finale: <span style={{ fontWeight: 500, color: COL.gold }}>{schedule.length >= 12 ? new Date(schedule[11].d).toLocaleDateString("en-AU", { day: "numeric", month: "short", year: "numeric" }) : "TBD"}</span>
        </div>
        {schedule.map((sched, i) => {
          const round = (data.rounds || [])[i];
          const done = !!round;
          const isFin = i >= 10;
          const isNext = sched.r === roundCount + 1;
          const isTeam = sched.r === 5 || sched.r === 10;
          const awayNow = (data.away || []).filter(a => { const d = new Date(sched.d); return d >= new Date(a.from) && d <= new Date(a.to); });
          return <React.Fragment key={i}>
            <div style={{
              display: "flex", alignItems: "center", gap: 10, padding: "10px 12px",
              background: isNext ? "rgba(78,164,124,.08)" : isFin ? "rgba(210,169,46,.07)" : "rgba(17,32,54,.42)",
              borderBottom: "1px solid rgba(143,161,196,.14)",
              borderLeft: isNext ? `3px solid ${COL.grn}` : done ? `3px solid #5b83ff` : isFin ? `3px solid ${COL.gold}` : isTeam ? `3px solid ${COL.gold}` : "3px solid rgba(143,161,196,.25)",
            }}>
              <div style={{ minWidth: 30 }}>
                <div style={{ fontSize: 14, fontWeight: 600, color: done ? "#9db6ff" : isFin ? COL.gold : COL.sil }}>R{sched.r}</div>
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 12, fontWeight: 500, color: done ? COL.w : isFin ? COL.gold : COL.sil }}>
                  {new Date(sched.d).toLocaleDateString("en-AU", { weekday: "short", day: "numeric", month: "short" })}
                </div>
                {done && <div style={{ fontSize: 10, color: COL.sil, marginTop: 2, display: "flex", gap: 4, alignItems: "center" }}>
                  <span style={{ fontWeight: 500, color: COL.w }}>{round.courseName}</span>
                  <span style={{ padding: "1px 6px", borderRadius: 8, background: COL.gold + "15", color: COL.gold, fontSize: 9, fontWeight: 500 }}>{roundWinner(round) || "?"} wins</span>
                </div>}
                {isFin && !done && <div style={{ fontSize: 11, color: COL.gold, fontWeight: 500, marginTop: 1 }}>{sched.note}</div>}
                {!isFin && !done && <div style={{ fontSize: 10, color: COL.sil, marginTop: 1 }}>{sched.lockedCourseName ? `${sched.lockedCourseName}${sched.teeTime ? ` · ${sched.teeTime}` : ""} · ${sched.host} hosting` : `${sched.host} books`}</div>}
                {isTeam && !done && <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 9, color: COL.gold, marginTop: 3, lineHeight: 1.4, fontWeight: 500 }}><UiIcon name="users" size={11} /> <span>2v2 Scramble · 1st+4th vs 2nd+3rd · pick best shot every stroke · winners +6 each, losers -2 each</span></div>}
              </div>
              <div style={{ display: "flex", gap: 3, flexWrap: "wrap", justifyContent: "flex-end" }}>
                {sched.lockedCourseName && !done && <span className="tracker-chip" style={{ fontSize: 9, padding: "2px 8px" }}>Locked</span>}
                {isTeam && !done && <span className="tracker-chip gold" style={{ fontSize: 9, padding: "2px 8px" }}>Scramble</span>}
                {isNext && <span className="tracker-chip green" style={{ fontSize: 9, padding: "2px 8px" }}>Next</span>}
                {done && <span className="tracker-chip" style={{ fontSize: 9, padding: "2px 8px" }}>Done</span>}
                {awayNow.map(a => <span key={a.who} style={{ fontSize: 9, padding: "2px 6px", borderRadius: 8, background: COL.red + "15", color: COL.red }}>{shortName(a.who)} away</span>)}
              </div>
            </div>
            {sched.r === 6 && <div style={{
              display: "flex", alignItems: "center", gap: 10, padding: "12px",
              background: "rgba(157,72,80,.08)",
              borderBottom: "1px solid rgba(143,161,196,.14)",
              borderLeft: `3px solid ${COL.red}`,
            }}>
              <div style={{ color: COL.red, flexShrink: 0 }}><UiIcon name="trophy" size={22} /></div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 12, fontWeight: 600, color: COL.red, textTransform: "uppercase", letterSpacing: 1 }}>Halfway League Roast</div>
                <div style={{ fontSize: 11, color: COL.w, marginTop: 2, fontWeight: 500 }}>Mandatory · Post-round roasties + season review</div>
                <div style={{ fontSize: 10, color: COL.sil, marginTop: 2, lineHeight: 1.4 }}>Pub session after R6. Standings audit, shot-shaping discussion, forfeit progress check.</div>
              </div>
              <span style={{ fontSize: 9, padding: "3px 8px", borderRadius: 8, background: COL.red + "20", color: COL.red, fontWeight: 600, flexShrink: 0 }}>MANDATORY</span>
            </div>}
          </React.Fragment>;
        })}

        {/* AVAILABILITY */}
        <div className="section-heading" style={{ marginTop: 16, marginBottom: 8 }}>Availability</div>
        <div style={{ fontSize: 10, color: COL.sil, marginBottom: 8 }}>Add dates when someone is away so rounds can be scheduled around it.</div>
        {(data.away || []).map((a, i) => (
          <div key={i} className="tracker-soft" style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 4, padding: "6px 8px" }}>
            <Avatar name={a.who} size={20} />
            <span style={{ fontSize: 11, fontWeight: 500, minWidth: 50 }}>{shortName(a.who)}</span>
            <span style={{ fontSize: 10, color: COL.sil, flex: 1 }}>
              {new Date(a.from).toLocaleDateString("en-AU", { day: "numeric", month: "short" })} - {new Date(a.to).toLocaleDateString("en-AU", { day: "numeric", month: "short" })}
            </span>
            <span style={{ fontSize: 9, color: COL.red }}>{a.note}</span>
            <button onClick={() => { const newAway = [...(data.away || [])]; newAway.splice(i, 1); save({ ...data, away: newAway }); }} style={{ fontSize: 9, color: COL.red, background: "transparent", border: "none", cursor: "pointer", padding: "2px 4px" }}>x</button>
          </div>
        ))}
        <div style={{ display: "flex", gap: 4, marginTop: 6, flexWrap: "wrap" }}>
          <select id="away-who" style={{ padding: 5, fontSize: 11, flex: "0 0 90px" }}>
            {PLAYERS.map(p => <option key={p} value={p}>{shortName(p)}</option>)}
          </select>
          <input id="away-from" type="date" style={{ padding: 5, fontSize: 11, flex: 1 }} />
          <input id="away-to" type="date" style={{ padding: 5, fontSize: 11, flex: 1 }} />
          <input id="away-note" placeholder="Reason" style={{ padding: 5, fontSize: 11, flex: 1 }} />
          <button onClick={() => {
            const who = document.getElementById("away-who")?.value;
            const from = document.getElementById("away-from")?.value;
            const to = document.getElementById("away-to")?.value;
            const note = document.getElementById("away-note")?.value || "";
            if (who && from && to) {
              save({ ...data, away: [...(data.away || []), { who, from, to, note }] });
              if (document.getElementById("away-from")) document.getElementById("away-from").value = "";
              if (document.getElementById("away-to")) document.getElementById("away-to").value = "";
              if (document.getElementById("away-note")) document.getElementById("away-note").value = "";
            }
          }} style={{ fontSize: 10, padding: "5px 10px", cursor: "pointer", background: COL.navy, color: COL.w, border: "none", borderRadius: 4 }}>Add</button>
        </div>

        {/* POT TRACKER */}
        <div className="section-heading" style={{ marginTop: 16, marginBottom: 4 }}>Season pot</div>
        <div style={{ fontSize: 10, color: COL.sil, marginBottom: 8 }}>Auto-tallies $40/round (league) and $100/round (finale).</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 12 }}>
          <div className="tracker-card" style={{ overflow: "hidden" }}>
            <div style={{ background: "rgba(255,255,255,.04)", padding: "6px 10px", color: COL.w, fontSize: 11, fontWeight: 600, borderBottom: "1px solid rgba(143,161,196,.14)" }}>League pot</div>
            <div style={{ padding: "12px 10px", textAlign: "center" }}>
              <div style={{ fontSize: 24, fontWeight: 500 }}>${leaguePot}</div>
              <div style={{ fontSize: 9, color: COL.sil }}>of ${TOTAL_ROUNDS * 40}</div>
              <div style={{ height: 4, background: "rgba(143,161,196,.18)", borderRadius: 2, marginTop: 6, overflow: "hidden" }}>
                <div style={{ height: "100%", width: `${Math.min(100, Math.round((leaguePot / (TOTAL_ROUNDS * 40)) * 100))}%`, background: COL.grn, borderRadius: 2, transition: "width 0.5s" }} />
              </div>
              <div style={{ fontSize: 8, color: COL.sil, marginTop: 4 }}>$10/player/round · 1st 60% · 2nd 25% · 3rd 15% · 4th forfeit</div>
            </div>
          </div>
          <div className="tracker-card" style={{ overflow: "hidden", borderColor: `${COL.gold}44` }}>
            <div style={{ background: "rgba(210,169,46,.12)", padding: "6px 10px", color: COL.gold, fontSize: 11, fontWeight: 600, borderBottom: `1px solid ${COL.gold}33` }}>Finale fund</div>
            <div style={{ padding: "12px 10px", textAlign: "center" }}>
              <div style={{ fontSize: 24, fontWeight: 500 }}>${finaleFundPot}</div>
              <div style={{ fontSize: 9, color: COL.sil }}>of $1,200</div>
              <div style={{ height: 4, background: "rgba(143,161,196,.18)", borderRadius: 2, marginTop: 6, overflow: "hidden" }}>
                <div style={{ height: "100%", width: `${Math.min(100, Math.round((finaleFundPot / 1200) * 100))}%`, background: COL.gold, borderRadius: 2, transition: "width 0.5s" }} />
              </div>
              <div style={{ fontSize: 8, color: COL.sil, marginTop: 4 }}>$25/player/round - Travel, accom & green fees</div>
            </div>
          </div>
        </div>
      </div>}

      {/* LIGHTBOX */}
      {lightbox && <div onClick={() => setLightbox(null)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.92)", zIndex: 1000, display: "flex", alignItems: "center", justifyContent: "center", padding: 20, cursor: "pointer" }}>
        <button onClick={(e) => { e.stopPropagation(); setLightbox(null); }} style={{ position: "absolute", top: 14, right: 14, width: 38, height: 38, borderRadius: "50%", background: "rgba(255,255,255,0.15)", color: "#fff", border: "none", fontSize: 20, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", lineHeight: 1 }}>×</button>
        <div style={{ position: "absolute", top: 18, left: 18, color: "#fff", fontSize: 12, opacity: 0.7 }}>{lightbox.index + 1} / {lightbox.photos.length}</div>
        {lightbox.index > 0 && <button onClick={(e) => { e.stopPropagation(); setLightbox({ ...lightbox, index: lightbox.index - 1 }); }} style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)", width: 44, height: 44, borderRadius: "50%", background: "rgba(255,255,255,0.15)", color: "#fff", border: "none", fontSize: 22, cursor: "pointer" }}>‹</button>}
        {lightbox.index < lightbox.photos.length - 1 && <button onClick={(e) => { e.stopPropagation(); setLightbox({ ...lightbox, index: lightbox.index + 1 }); }} style={{ position: "absolute", right: 14, top: "50%", transform: "translateY(-50%)", width: 44, height: 44, borderRadius: "50%", background: "rgba(255,255,255,0.15)", color: "#fff", border: "none", fontSize: 22, cursor: "pointer" }}>›</button>}
        <img src={lightbox.photos[lightbox.index]} onClick={(e) => e.stopPropagation()} alt="" style={{ maxWidth: "94vw", maxHeight: "88vh", borderRadius: 8, cursor: "default", boxShadow: "0 20px 60px rgba(0,0,0,0.5)" }} />
      </div>}

      {/* SYNC STATUS FOOTER */}
      <div style={{ marginTop: 16, padding: "8px 12px", textAlign: "center", fontSize: 10, color: COL.sil, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
        <span style={{ display: "inline-block", width: 6, height: 6, borderRadius: "50%", background: saving ? COL.gold : COL.grn }} />
        {saving ? "Saving..." : updatedAt ? `Synced · last update ${new Date(updatedAt).toLocaleString("en-AU", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" })}` : "Live sync on"}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));</script></body></html>
