*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif;background:#07101d;color:#eaf1fb;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
input,select,button,textarea{font-family:inherit;color:inherit}

input[type="text"],input[type="number"],input[type="date"],input:not([type]),select,textarea{
  appearance:none;-webkit-appearance:none;-moz-appearance:none;
  background-color:#0d1b30;
  border:1px solid rgba(143,161,196,.24);
  border-radius:6px;
  color:#eaf1fb;
  font-size:13px;
  outline:none;
  transition:border-color .12s ease,box-shadow .12s ease;
}

select{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6' fill='none'><path d='M1 1L5 5L9 1' stroke='%236b7280' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat;
  background-position:right 10px center;
  padding-right:28px!important;
  cursor:pointer;
}

input:hover,select:hover,textarea:hover{border-color:rgba(143,161,196,.44)}
input:focus,select:focus,textarea:focus{border-color:#5b83ff;box-shadow:0 0 0 3px rgba(91,131,255,0.16)}
input::placeholder,textarea::placeholder{color:#70819f}

input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type="number"]{-moz-appearance:textfield}

button{
  font-family:inherit;font-size:13px;cursor:pointer;
  border:1px solid rgba(143,161,196,.24);background:#0d1b30;color:#eaf1fb;
  border-radius:6px;padding:7px 14px;
  transition:background .12s ease,border-color .12s ease,transform .08s ease;
}
button:hover:not(:disabled){background:#142740;border-color:rgba(143,161,196,.44)}
button:active:not(:disabled){transform:translateY(0.5px)}
button:disabled{opacity:.5;cursor:not-allowed}

textarea{resize:vertical;line-height:1.5}

.tracker-app{
  max-width:720px;
  margin:0 auto;
  padding:.5rem;
  color:#eaf1fb;
}
.tracker-app::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:
    radial-gradient(circle at 16% 0%, rgba(91,131,255,.14), transparent 34%),
    linear-gradient(115deg, rgba(255,255,255,.04) 0 18%, transparent 18% 100%),
    #07101d;
}
.tracker-card{
  border:1px solid rgba(143,161,196,.22);
  background:linear-gradient(145deg,rgba(18,33,56,.96),rgba(11,22,39,.96));
  border-radius:12px;
  box-shadow:0 18px 45px rgba(0,0,0,.24);
}
.tracker-soft{
  border:1px solid rgba(143,161,196,.18);
  background:rgba(17,32,54,.72);
  border-radius:10px;
}
.tracker-kicker{
  color:#6f95ff;
  font-size:10px;
  font-weight:800;
  letter-spacing:2.4px;
  text-transform:uppercase;
}
.tracker-muted{color:#9fb1d1}
.tracker-chip{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:22px;
  padding:4px 8px;
  border:1px solid rgba(143,161,196,.24);
  border-radius:999px;
  background:rgba(255,255,255,.055);
  color:#c7d3e6;
  font-size:10px;
  font-weight:650;
  line-height:1;
}
.tracker-chip.gold{border-color:rgba(210,169,46,.36);background:rgba(210,169,46,.12);color:#e2c86c}
.tracker-chip.red{border-color:rgba(157,72,80,.36);background:rgba(157,72,80,.14);color:#eca1a7}
.tracker-chip.green{border-color:rgba(78,164,124,.36);background:rgba(78,164,124,.13);color:#8fd6b0}
.hero-card{
  background:linear-gradient(155deg,#12213b,#0b1627 72%);
  border:1px solid rgba(143,161,196,.22);
  border-radius:14px;
  margin-bottom:10px;
  overflow:hidden;
  box-shadow:0 20px 50px rgba(0,0,0,.26);
}
.hero-card img{opacity:.78;filter:saturate(.9) contrast(1.08)}
.tab-bar{
  display:flex;
  gap:6px;
  margin-bottom:1rem;
  padding:5px;
  border:1px solid rgba(143,161,196,.2);
  border-radius:12px;
  background:rgba(9,19,34,.68);
}
.tab-button{
  flex:1;
  padding:8px 0!important;
  font-size:12px!important;
  border:0!important;
  border-radius:8px!important;
  background:transparent!important;
  color:#8fa1c4!important;
}
.tab-button.active{
  background:#12213b!important;
  color:#fff!important;
  box-shadow:inset 0 0 0 1px rgba(143,161,196,.18);
}
.section-heading{
  color:#dce7f7;
  font-size:14px;
  font-weight:750;
  letter-spacing:.7px;
}
.subtle-rule{border-color:rgba(143,161,196,.18)!important}
.dark-input-panel{
  border:1px solid rgba(143,161,196,.18);
  background:rgba(13,27,48,.64);
  border-radius:10px;
}

.up-next-card{
  border-radius:12px;
  padding:14px 16px;
  margin-bottom:12px;
  display:grid;
  grid-template-columns:52px minmax(0,1fr) auto;
  gap:12px;
  align-items:start;
  background:linear-gradient(135deg,#0E1E2D,#1a3350);
  color:#fff;
  box-shadow:0 4px 12px rgba(14,30,45,.16);
}
.up-next-round{
  width:52px;
  height:52px;
  border-radius:50%;
  background:#D4AF37;
  color:#0E1E2D;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
  font-weight:800;
  line-height:1;
}
.up-next-kicker{
  display:flex;
  align-items:center;
  gap:5px;
  color:#D4AF37;
  font-size:9px;
  font-weight:800;
  letter-spacing:1.3px;
  text-transform:uppercase;
  margin-bottom:4px;
}
.up-next-title-row{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
}
.up-next-title{font-size:18px;font-weight:750;line-height:1.15}
.up-next-type{
  flex-shrink:0;
  border:1px solid rgba(212,175,55,.32);
  background:rgba(212,175,55,.12);
  color:#f1d77b;
  border-radius:999px;
  padding:3px 8px;
  font-size:9px;
  font-weight:800;
  letter-spacing:.7px;
  text-transform:uppercase;
}
.up-next-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.up-next-chip{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:24px;
  padding:5px 7px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:7px;
  background:rgba(255,255,255,.07);
  color:#d5dce4;
  font-size:11px;
  line-height:1;
}
.up-next-chip strong{color:#fff;font-weight:700}
.up-next-teams{
  margin-top:10px;
  display:grid;
  grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr);
  gap:8px;
  align-items:stretch;
}
.up-next-team{
  border:1px solid rgba(255,255,255,.13);
  background:rgba(255,255,255,.08);
  border-radius:8px;
  padding:8px 10px;
  min-width:0;
}
.up-next-team-label{
  display:flex;
  align-items:center;
  gap:5px;
  color:#D4AF37;
  font-size:9px;
  font-weight:800;
  letter-spacing:.8px;
  text-transform:uppercase;
  margin-bottom:5px;

.up-next-team-names{
  color:#fff;
  font-size:13px;
  font-weight:750;
  line-height:1.25;
  overflow-wrap:anywhere;
}
.up-next-vs{
  color:#a0aab4;
  font-size:10px;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  text-transform:uppercase;
}
.up-next-rules{
  margin-top:8px;
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:6px;
}
.up-next-rule{
  min-width:0;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.055);
  border-radius:7px;
  padding:7px 8px;
}
.up-next-rule-label{
  display:flex;
  align-items:center;
  gap:5px;
  color:#D4AF37;
  font-size:8px;
  font-weight:800;
  letter-spacing:.7px;
  text-transform:uppercase;
  margin-bottom:3px;
}
.up-next-rule-text{color:#edf2f7;font-size:10.5px;line-height:1.3}
.up-next-away{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.up-next-away-pill{
  font-size:9px;
  padding:3px 8px;
  border-radius:8px;
  background:rgba(139,26,26,.3);
  color:#ffaaaa;
  white-space:nowrap;
}
@media(max-width:560px){
  .up-next-card{grid-template-columns:44px minmax(0,1fr);padding:13px;gap:10px}
  .up-next-round{width:44px;height:44px;font-size:15px}
  .up-next-away{grid-column:2;align-items:flex-start}
  .up-next-title-row{display:block}
  .up-next-type{display:inline-flex;margin-top:6px}
  .up-next-title{font-size:16px}
  .up-next-teams{grid-template-columns:1fr}
  .up-next-vs{justify-content:flex-start;height:18px;padding-left:2px}
  .up-next-rules{grid-template-columns:1fr}
}

const HOST_ORDER = ["Fishy", "Sea", "Niall", "Brother Conor"];
const START_DATE = "2026-04-18";
const GAP_DAYS = 14;

function buildSchedule(awayList, locks) {
  const away = awayList || [];
  const lockedRounds = locks || {};
  const isAway = (dateStr) => {
    const d = new Date(dateStr);
    return away.some(a => d >= new Date(a.from) && d <= new Date(a.to));
  };
  const addDays = (dateStr, n) => {
    const d = new Date(dateStr);
    d.setDate(d.getDate() + n);
    return d.toISOString().split("T")[0];
  };
  const toSaturday = (dateStr) => {
    const d = new Date(dateStr);
    const day = d.getDay();
    if (day === 6) return dateStr;
    const diff = day === 0 ? 6 : 6 - day;
    return addDays(dateStr, diff);
  };
  const findNextFree = (fromDate) => {
    let d = toSaturday(fromDate);
    let tries = 0;
    while (isAway(d) && tries < 52) {
      d = addDays(d, 7);
      tries++;
    }
    return d;
  };

  const schedule = [];
  let cursor = START_DATE;

  for (let r = 1; r <= 10; r++) {
    const lock = lockedRounds[r];
    let date;
    if (lock && lock.date) {
      date = lock.date;
    } else {
      const target = r === 1 ? cursor : addDays(cursor, GAP_DAYS);
      date = findNextFree(target);
    }
    schedule.push({
      r,
      d: date,
      host: (lock && lock.host) || HOST_ORDER[(r - 1) % 4],
      lockedCourseId: lock && lock.courseId ? lock.courseId : null,
      lockedCourseName: lock && lock.courseName ? lock.courseName : null,
      teeTime: lock && lock.teeTime ? lock.teeTime : null,
      teams: lock && lock.teams ? lock.teams : null,
    });
    cursor = date;
  }

  // R11 + R12: Barnbougle weekend, both days consecutive
  const finaleTarget = addDays(cursor, GAP_DAYS + 7);
  const finaleStart = findNextFree(finaleTarget);
  schedule.push({ r: 11, d: finaleStart, host: "All", note: "Lost Farm, TAS" });
  schedule.push({ r: 12, d: addDays(finaleStart, 1), host: "All", note: "Barnbougle Dunes, TAS" });

  return schedule;
}

function renderRichText(text) {
  if (!text) return null;
  const parts = text.split(/(\*\*[^*]+\*\*)/g);
  return parts.map((p, i) =>
    p.startsWith("**") && p.endsWith("**")
      ? React.createElement("strong", { key: i, style: { fontWeight: 700, color: "#f4f7fb" } }, p.slice(2, -2))
      : p
  );
}
// Pull the section about a specific player from a markdown summary.
// Matches headers like "**Sea**" or "**Brother Conor**" and grabs text until next "**" header.
function extractPlayerSection(summary, playerName) {
  if (!summary) return null;
  const aliases = playerName === "Brother Conor"
    ? ["Brother Conor", "Conor", "BC"]
    : playerName === "Sea"
    ? ["Sea"]
    : playerName === "Fishy"
    ? ["Fishy"]
    : playerName === "Niall"
    ? ["Niall"]
    : [playerName];
  for (const alias of aliases) {
    const escaped = alias.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const re = new RegExp(`\\*\\*${escaped}\\*\\*\\s*\\n?([\\s\\S]*?)(?=\\n\\s*\\*\\*[^*]+\\*\\*|$)`, "i");
    const match = summary.match(re);
    if (match && match[1].trim()) return match[1].trim();
  }
  return null;
}

function resizeImage(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        // 1200px max keeps scorecards legible; 0.7 quality is a good size/quality balance.
        const ratio = Math.min(1200 / img.width, 1200 / img.height, 1);
        canvas.width = img.width * ratio;
        canvas.height = img.height * ratio;
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.7));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function App() {

  }, []);

  const allCourses = [...COURSES, ...(data.custom || [])];

  const roundCount = (data.rounds || []).length;
  const progressPct = Math.round((roundCount / TOTAL_ROUNDS) * 100);

  // Standings
  const standings = PLAYERS.map(p => {
    let pts = 0, wins = 0, lollies = 0, mares = 0, ctp = 0, totalSf = 0, sfScores = [], best = -1, worst = 999;
    (data.rounds || []).forEach(r => {
      if (r.isTeam && r.teams && r.winningTeam) {
        const teamA = r.teams.A || [];

        const onA = teamA.includes(p);
        const onB = teamB.includes(p);
        if (onA || onB) {
          const won = (r.winningTeam === "A" && onA) || (r.winningTeam === "B" && onB);
          pts += won ? 6 : -2;
          if (won) wins++;
        }
      } else {
        const pos = r.placements ? r.placements[p] : null;
        if (pos) {
          const roundPts = pointsForRound(r.placements);
          pts += roundPts[p] || 0;
          // Win counts only when sole 1st place (no tied wins)
          const firsts = Object.values(r.placements).filter(v => v === 1).length;
          if (pos === 1 && firsts === 1) wins++;
        }
        if (!pos && r.winner === p) {
          pts += PTS[1];
          wins++;
        }
      }
      if (r.lollies && r.lollies.winner === p) { pts += 1; lollies++; }
      if (r.mare && r.mare.winner === p) { pts -= 1; mares++; }
      if (r.ctp && r.ctp.winner === p) { pts += 1; ctp++; }
      const sf = r.scores ? r.scores[p] : null;
      if (sf && sf > 0) { totalSf += sf; sfScores.push(sf); if (sf > best) best = sf; if (sf < worst) worst = sf; }
    });
    const avg = sfScores.length ? Math.round(totalSf / sfScores.length) : 0;
    const lastScore = sfScores.length ? sfScores[sfScores.length - 1] : null;
    const last3 = sfScores.slice(-3);
    let trend = 0;
    if (last3.length >= 2) { const diff = last3[last3.length - 1] - last3[0]; trend = diff > 2 ? 1 : diff < -2 ? -1 : 0; }
    return {
      name: p, pts, wins, lollies, mares, ctp,
      played: (data.rounds || []).filter(r => r.winner || (r.placements && r.placements[p]) || (r.isTeam && r.teams && (r.teams.A || []).concat(r.teams.B || []).includes(p))).length,
      avg, best: best < 0 ? 0 : best, worst: worst > 900 ? 0 : worst,
      trend, totalSf,
      isPB: lastScore != null && lastScore === best && sfScores.length > 1,
      isStinker: lastScore != null && lastScore === worst && sfScores.length > 1 && lastScore !== best,
      hc: (data.handicaps || {})[p] || "",
    };
  }).sort((a, b) => {
    if (b.pts !== a.pts) return b.pts - a.pts;
    if (b.wins !== a.wins) return b.wins - a.wins;
    if (b.totalSf !== a.totalSf) return b.totalSf - a.totalSf;
    // Tiebreaker: higher handicap on top (confidence boost for the underdog)
    const aHc = parseInt(a.hc) || 0;
    const bHc = parseInt(b.hc) || 0;
    return bHc - aHc;
  });

  const toggleCourse = (player, courseId) => {

  const schedule = buildSchedule(data.away, data.lockedRounds);
  const nextRound = schedule.find(s => s.r > roundCount) || null;
  const nextRoundIsTeam = !!nextRound && (nextRound.r === 5 || nextRound.r === 10);
  const nextRoundTeams = nextRoundIsTeam ? (nextRound.teams || suggestedTeams) : null;
  const nextRoundCourse = nextRound && nextRound.lockedCourseId ? allCourses.find(c => c.id === nextRound.lockedCourseId) : null;
  const nextRoundCourseName = nextRoundCourse ? nextRoundCourse.n : (nextRound && nextRound.lockedCourseName ? nextRound.lockedCourseName : "");
  const leaguePot = roundCount * 40;
  const finaleFundPot = roundCount * 100;

  if (!loaded) return <div style={{ padding: "2rem", textAlign: "center", color: "#9fb1d1" }}>Loading...</div>;

  const cardStyle = { padding: "10px 12px", borderRadius: 10, border: "1px solid rgba(143,161,196,.18)", background: "rgba(17,32,54,.72)", marginBottom: 6, color: COL.w };

  return (
    <div className="tracker-app" style={{ fontFamily: "-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" }}>
      {/* HEADER */}
      <div className="hero-card">
        {COVER_IMG && <img src={COVER_IMG} alt="" style={{ width: "100%", display: "block" }} />}
        <div style={{ padding: "18px 14px 20px", textAlign: "center" }}>
        <Crest size={40} />
        <h1 style={{ fontSize: 30, fontWeight: 650, margin: "10px 0 4px", color: COL.w, letterSpacing: 0 }}>The Carlton Kants</h1>
        <div style={{ fontSize: 15, color: COL.gold, fontStyle: "italic" }}>Road to Barnbougle</div>
        <div style={{ fontSize: 12, color: COL.sil, marginTop: 2 }}>Season 1 - Net Stableford - 12 Rounds</div>
        <div style={{ fontSize: 9, color: COL.gold, marginTop: 12, textTransform: "uppercase", letterSpacing: 1.5, opacity: 0.85 }}>Tap a player for their profile</div>
        <div style={{ display: "flex", justifyContent: "center", gap: 0, margin: "6px 0 10px", justifyContent: "space-around" }}>
          {PLAYERS.map(p => <div key={p} onClick={() => setProfileFor(p)} style={{ textAlign: "center", cursor: "pointer", transition: "transform 0.15s" }} onMouseEnter={e => e.currentTarget.style.transform = "scale(1.06)"} onMouseLeave={e => e.currentTarget.style.transform = "scale(1)"}><Avatar name={p} size={52} /><div style={{ fontSize: 11, color: COL.w, fontWeight: 500, marginTop: 3 }}>{shortName(p)}</div></div>)}
        </div>
        <div style={{ margin: "4px auto", maxWidth: "90%" }}>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 9, color: COL.sil, marginBottom: 2 }}>
            <span>R{roundCount}/{TOTAL_ROUNDS}</span>
            <span style={{ color: COL.gold }}>Road to Barnbougle</span>
          </div>
          <div style={{ height: 5, background: COL.nm, borderRadius: 3, overflow: "hidden" }}>
            <div style={{ height: "100%", width: `${progressPct}%`, background: `linear-gradient(90deg,${COL.nl},${COL.grn})`, borderRadius: 3, transition: "width 0.5s" }} />
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 7, color: COL.sil, marginTop: 1, opacity: 0.6 }}>
            <span>Victoria</span><span>Tasmania</span>
          </div>
        </div>
        </div>
      </div>

      {/* NEXT ROUND BANNER */}
      {nextRound && <div className="up-next-card">
        <div className="up-next-round">R{nextRound.r}</div>
        <div style={{ minWidth: 0 }}>
          <div className="up-next-kicker"><UiIcon name="flag" size={12} />Up next</div>
          <div className="up-next-title-row">
            <div className="up-next-title">{new Date(nextRound.d).toLocaleDateString("en-AU", { weekday: "long", day: "numeric", month: "long" })}</div>
            {nextRoundIsTeam && <div className="up-next-type">2v2 scramble</div>}
          </div>
          <div className="up-next-meta">
            <span className="up-next-chip"><UiIcon name="pin" size={12} />{nextRoundCourseName ? <strong>{nextRoundCourseName}</strong> : <em>Course TBD</em>}</span>
            {nextRound.teeTime && <span className="up-next-chip"><UiIcon name="clock" size={12} /><strong>{nextRound.teeTime}</strong></span>}
            <span className="up-next-chip"><UiIcon name="user" size={12} />{nextRound.host === "All" ? "Everyone" : nextRound.host + (nextRound.lockedCourseName ? " hosting" : " to book")}</span>
            {nextRound.note && <span className="up-next-chip"><UiIcon name="calendar" size={12} />{nextRound.note}</span>}
          </div>
          {nextRoundTeams && <div className="up-next-teams">
            <div className="up-next-team">
              <div className="up-next-team-label"><UiIcon name="users" size={12} />1st + 4th</div>
              <div className="up-next-team-names">{(nextRoundTeams.A || []).map(shortName).join(" & ")}</div>
            </div>
            <div className="up-next-vs">vs</div>
            <div className="up-next-team">
              <div className="up-next-team-label"><UiIcon name="users" size={12} />2nd + 3rd</div>
              <div className="up-next-team-names">{(nextRoundTeams.B || []).map(shortName).join(" & ")}</div>
            </div>
          </div>}
          {nextRoundIsTeam && <div className="up-next-rules">
            <div className="up-next-rule">
              <div className="up-next-rule-label"><UiIcon name="target" size={11} />Format</div>
              <div className="up-next-rule-text">Pick the best shot every stroke.</div>
            </div>
            <div className="up-next-rule">
              <div className="up-next-rule-label"><UiIcon name="users" size={11} />Teams</div>
              <div className="up-next-rule-text">Leaderboard split: 1+4 vs 2+3.</div>
            </div>
            <div className="up-next-rule">
              <div className="up-next-rule-label"><UiIcon name="trophy" size={11} />Points</div>
              <div className="up-next-rule-text">Winners +6 each. Losers -2 each.</div>
            </div>
          </div>}
        </div>
        <div className="up-next-away">
          {(data.away || []).filter(a => { const rd = new Date(nextRound.d); return rd >= new Date(a.from) && rd <= new Date(a.to); }).map(a =>
            <span key={a.who} className="up-next-away-pill">{shortName(a.who)} away</span>
          )}
        </div>
      </div>}

      {/* ===== PLAYER PROFILE ===== */}
      {profileFor && (() => {
        const p = profileFor;
        const ps = standings.find(s => s.name === p) || { name: p, pts: 0, wins: 0, lollies: 0, mares: 0, ctp: 0, played: 0, avg: 0, best: 0 };
        const playerRounds = (data.rounds || []).map((r, i) => ({ ...r, _idx: i })).filter(r =>
          r.winner ||
          (r.placements && r.placements[p]) ||
          (r.isTeam && r.teams && (r.teams.A || []).concat(r.teams.B || []).includes(p))
        );
        const lolliesHist = (data.rounds || []).filter(r => r.lollies && r.lollies.winner === p);
        const maresHist = (data.rounds || []).filter(r => r.mare && r.mare.winner === p);
        const ctpHist = (data.rounds || []).filter(r => r.ctp && r.ctp.winner === p);
        const summaryExcerpts = (data.rounds || [])
          .map(r => ({ round: r, section: extractPlayerSection(r.summary, p) }))
          .filter(x => x.section);
        const handicap = (data.handicaps || {})[p] || "-";

        const sectionTitle = (txt, count) => (
          <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginTop: 18, marginBottom: 8, paddingBottom: 6, borderBottom: "1px solid rgba(143,161,196,.18)" }}>
            <span className="tracker-kicker" style={{ letterSpacing: 1 }}>{txt}</span>
            {count !== undefined && <span style={{ fontSize: 10, color: COL.sil }}>({count})</span>}
          </div>
        );

        return <div>
          <button onClick={() => setProfileFor(null)} style={{ fontSize: 12, padding: "6px 12px", marginBottom: 10, background: "transparent", color: COL.sil, border: "1px solid rgba(143,161,196,.22)", borderRadius: 6, cursor: "pointer", fontWeight: 500 }}>← Back to dashboard</button>

          {/* Profile header */}
          <div className="tracker-card" style={{ padding: "20px 18px", color: COL.w, marginBottom: 14, display: "flex", alignItems: "center", gap: 14, position: "relative", overflow: "hidden" }}>
            <div style={{ position: "absolute", top: 10, left: 18, display: "flex", alignItems: "center", gap: 5, fontSize: 9, fontWeight: 700, color: COL.gold, textTransform: "uppercase", letterSpacing: 2 }}><UiIcon name="user" size={11} /> Player Profile</div>
            <Avatar name={p} size={68} />
            <div style={{ flex: 1, marginTop: 8 }}>
              <div style={{ fontSize: 22, fontWeight: 700, lineHeight: 1.1 }}>{p}</div>
              <div style={{ fontSize: 11, color: COL.sil, marginTop: 4 }}>Handicap {handicap} · {ps.played} {ps.played === 1 ? "round" : "rounds"} played</div>
            </div>
            <div style={{ textAlign: "right", marginTop: 8 }}>
              <div style={{ fontSize: 28, fontWeight: 700, color: COL.gold, lineHeight: 1 }}>{ps.pts}</div>
              <div style={{ fontSize: 10, color: COL.sil, textTransform: "uppercase", letterSpacing: 1 }}>pts</div>
            </div>
          </div>

          {/* Stat strip */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 4, marginBottom: 12 }}>
            {[
              { l: "Wins", v: ps.wins, c: COL.gold },
              { l: "LOLLIES", v: ps.lollies || 0, c: COL.gold },
              { l: "Mares", v: ps.mares || 0, c: COL.red },
              { l: "CTP", v: ps.ctp || 0, c: COL.grn },
              { l: "Best SF", v: ps.best || "-", c: "#6f95ff" },
            ].map(stat => (
              <div key={stat.l} className="tracker-soft" style={{ padding: "8px 4px", textAlign: "center" }}>
                <div style={{ fontSize: 18, fontWeight: 700, color: stat.c }}>{stat.v}</div>
                <div style={{ fontSize: 9, color: COL.sil, textTransform: "uppercase", letterSpacing: 0.5 }}>{stat.l}</div>
              </div>
            ))}
          </div>

          {/* Round history */}
          {sectionTitle("Round history", playerRounds.length)}
          {playerRounds.length === 0 ? (
            <div style={{ fontSize: 12, color: COL.sil, padding: "12px 0" }}>No rounds played yet.</div>
          ) : playerRounds.map((r) => {
            const pos = r.placements ? r.placements[p] : null;
            const sf = (r.scores || {})[p];
            const onTeamA = r.isTeam && r.teams && (r.teams.A || []).includes(p);
            const onTeamB = r.isTeam && r.teams && (r.teams.B || []).includes(p);
            const won = r.isTeam && ((r.winningTeam === "A" && onTeamA) || (r.winningTeam === "B" && onTeamB));
            const winnerOnly = !r.isTeam && r.winner && !(r.placements && r.placements[p]);
            return <div key={r.num} className="tracker-soft" style={{ padding: "10px 12px", marginBottom: 6, display: "flex", alignItems: "center", gap: 10 }}>
              <div style={{ minWidth: 30 }}>
                <div style={{ fontSize: 12, fontWeight: 700, color: COL.gold }}>R{r.num}</div>
                <div style={{ fontSize: 9, color: COL.sil }}>{r.date}</div>
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: COL.w }}>{r.courseName}</div>
                <div style={{ fontSize: 10, color: COL.sil }}>
                  {r.isTeam ? (won ? "Team scramble · won" : "Team scramble · lost") : winnerOnly ? (r.winner === p ? "Winner · scorecard pending" : "Played · scorecard pending") : (pos ? `${placementLabel(r.placements, p)} · ${sf || "-"} stableford` : "-")}
                </div>
              </div>
              <div style={{ fontSize: 13, fontWeight: 700, color: r.isTeam ? (won ? COL.grn : COL.red) : winnerOnly && r.winner === p ? COL.gold : "#9db6ff" }}>
                {r.isTeam ? (won ? "+6" : "-2") : winnerOnly ? (r.winner === p ? "+6" : "+0") : `+${pointsForRound(r.placements)[p] || 0}`}
              </div>
            </div>;
          })}

          {/* Written summary excerpts */}
          {summaryExcerpts.length > 0 && <>
            {sectionTitle("Written about", summaryExcerpts.length)}
            {summaryExcerpts.map(ex => (
              <div key={ex.round.num} className="tracker-soft" style={{ padding: "10px 12px", marginBottom: 6 }}>
                <div style={{ fontSize: 10, color: COL.sil, marginBottom: 4, fontWeight: 500 }}>R{ex.round.num} · {ex.round.courseName}</div>
                <div style={{ fontSize: 12, lineHeight: 1.5, whiteSpace: "pre-wrap", color: COL.w }}>{renderRichText(ex.section)}</div>
              </div>
            ))}
          </>}

          {/* LOLLIES wins */}
          {lolliesHist.length > 0 && <>
            {sectionTitle("LOLLIES wins", lolliesHist.length)}
            {lolliesHist.map(r => (
              <div key={r.num} style={{ borderRadius: 8, border: `1px solid ${COL.gold}40`, background: COL.gold + "08", padding: "10px 12px", marginBottom: 6 }}>
                <div style={{ fontSize: 10, color: COL.gold, fontWeight: 600, marginBottom: 3 }}>R{r.num} · {r.courseName}</div>
                <div style={{ fontSize: 12, color: COL.w, lineHeight: 1.4 }}>{r.lollies.desc || "(no description)"}</div>
              </div>
            ))}
          </>}

          {/* Mares */}
          {maresHist.length > 0 && <>
            {sectionTitle("Mares", maresHist.length)}
            {maresHist.map(r => (
              <div key={r.num} style={{ borderRadius: 8, border: `1px solid ${COL.red}30`, background: COL.red + "06", padding: "10px 12px", marginBottom: 6 }}>
                <div style={{ fontSize: 10, color: COL.red, fontWeight: 600, marginBottom: 3 }}>R{r.num} · {r.courseName}</div>
                <div style={{ fontSize: 12, color: COL.w, lineHeight: 1.4 }}>{r.mare.desc || "(no description)"}</div>
              </div>
            ))}
          </>}

          {/* CTP wins */}
          {ctpHist.length > 0 && <>
            {sectionTitle("Closest to pin", ctpHist.length)}
            {ctpHist.map(r => (
              <div key={r.num} style={{ borderRadius: 8, border: `1px solid ${COL.grn}40`, background: COL.grn + "08", padding: "8px 12px", marginBottom: 6, display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontSize: 10, color: COL.grn, fontWeight: 600, minWidth: 30 }}>R{r.num}</span>
                <span style={{ fontSize: 12, color: COL.w, flex: 1 }}>{r.courseName}</span>
                <span style={{ fontSize: 10, color: COL.grn, fontWeight: 600 }}>+1 pt</span>
              </div>
            ))}
          </>}

          {/* Empty state if no achievements */}
          {summaryExcerpts.length === 0 && lolliesHist.length === 0 && maresHist.length === 0 && ctpHist.length === 0 && playerRounds.length > 0 && (
            <div className="tracker-soft" style={{ marginTop: 16, padding: 16, fontSize: 12, color: COL.sil, textAlign: "center" }}>No LOLLIES, mares, CTP wins or written notes yet.</div>
          )}
        </div>;
      })()}

      {/* TABS - hidden when in profile view */}
      {!profileFor && <div className="tab-bar">
        {[
          { key: "standings", label: "Standings" },
          { key: "finale", label: "Road to Barny" },
          { key: "recaps", label: "Recaps" },
          { key: "courses", label: "Courses" },
        ].map(tab => (
          <button key={tab.key} className={`tab-button ${view === tab.key ? "active" : ""}`} onClick={() => { setView(tab.key); setPickFor(null); setEntering(false); }}>{tab.label}</button>
        ))}
      </div>}

      {/* ===== STANDINGS ===== */}
      {view === "standings" && !profileFor && <div>
        {standings.map((s, i) => {
          const isLast = i === 3 && roundCount >= 1;
          const isFirst = i === 0 && s.pts > 0;
          const muted = isFirst ? COL.sil : isLast ? "#d89aa0" : COL.sil;
          const primary = isFirst ? COL.w : isLast ? "#f1b5ba" : COL.w;
          const divCol = isFirst ? "rgba(143,161,196,.22)" : isLast ? "rgba(157,72,80,.26)" : "rgba(143,161,196,.16)";
          return (
            <div key={s.name}>
              <div style={{
                padding: "12px", marginBottom: isLast ? 0 : 6,
                background: isLast ? "linear-gradient(145deg,rgba(64,27,36,.78),rgba(19,30,49,.92))" : isFirst ? "linear-gradient(145deg,#132640,#0d1b30)" : "linear-gradient(145deg,rgba(18,33,56,.9),rgba(11,22,39,.9))",
                borderRadius: isLast ? "10px 10px 0 0" : 10,
                border: isLast ? `1px solid ${COL.red}66` : isFirst ? `1px solid ${COL.gold}80` : "1px solid rgba(143,161,196,.18)",
                boxShadow: isFirst ? "0 18px 40px rgba(0,0,0,.22)" : "none",
              }}>
                {/* Top row: rank, avatar, name, points */}
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
                  <div style={{ fontSize: 22, fontWeight: 700, width: 24, textAlign: "center", color: isFirst ? COL.gold : isLast ? "#f1b5ba" : COL.sil }}>{i + 1}</div>
                  <Avatar name={s.name} size={44} />
                  <div style={{ flex: 1 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
                      <span style={{ fontSize: 16, fontWeight: 500, color: primary }}>{s.name}</span>
                      {s.trend === 1 && <span style={{ color: COL.grn, fontSize: 12 }}>&#9650;</span>}
                      {s.trend === -1 && <span style={{ color: "#d89aa0", fontSize: 12 }}>&#9660;</span>}
                      {s.isPB && <span className="tracker-chip gold" style={{ fontSize: 8, padding: "2px 6px" }}>PB!</span>}
                      {s.isStinker && <span className="tracker-chip red" style={{ fontSize: 8, padding: "2px 6px" }}>Stinker</span>}
                    </div>
                    {s.hc && <div style={{ fontSize: 10, color: muted }}>Handicap {s.hc}</div>}
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontSize: 30, fontWeight: 650, color: isFirst ? COL.gold : isLast ? "#f1b5ba" : COL.w, lineHeight: 1 }}>{s.pts}</div>
                    <div style={{ fontSize: 9, color: muted }}>pts</div>
                  </div>
                </div>
                {/* Stats grid */}
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 0, marginTop: 10, border: "1px solid " + divCol, borderRadius: 8, overflow: "hidden", background: "rgba(255,255,255,.035)" }}>
                  {[{v: s.wins, l: "Wins"}, {v: s.played, l: "Played"}, {v: s.avg || "-", l: "Avg SF"}, {v: s.totalSf || "-", l: "Total SF"}].map((stat, si) => (
                    <div key={si} style={{ textAlign: "center", padding: "8px 4px", borderRight: si < 3 ? "1px solid " + divCol : "none" }}>
                      <div style={{ fontSize: 16, fontWeight: 500, color: primary }}>{stat.v}</div>
                      <div style={{ fontSize: 9, color: muted }}>{stat.l}</div>
                    </div>
                  ))}
                </div>
                {/* Awards row */}
                {(s.lollies > 0 || s.mares > 0 || s.ctp > 0 || s.best > 0) && <div style={{ textAlign: "center", marginTop: 8, paddingBottom: 4 }}>
                    {s.lollies > 0 && <span className="tracker-chip gold" style={{ margin: "0 3px" }}>{s.lollies} LOLLIES</span>}
                    {s.mares > 0 && <span className="tracker-chip red" style={{ margin: "0 3px" }}>{s.mares} {s.mares === 1 ? "Mare" : "Mares"}</span>}
                    {s.ctp > 0 && <span className="tracker-chip green" style={{ margin: "0 3px" }}>{s.ctp} CTP</span>}
                    {s.best > 0 && <span className="tracker-chip green" style={{ margin: "0 3px" }}>Best {s.best}</span>}
                </div>}
              </div>
              {isLast && data.forfeit && <div style={{ background: "rgba(157,72,80,.22)", border: `1px solid ${COL.red}55`, borderTop: 0, borderRadius: "0 0 10px 10px", padding: "6px 10px", marginBottom: 8, textAlign: "center" }}>
                <div style={{ fontSize: 8, color: "#eca1a7", letterSpacing: 1, fontWeight: 700 }}>FORFEIT ZONE</div>
                <div style={{ fontSize: 11, color: COL.w }}>{data.forfeit}</div>
              </div>}
            </div>
          );
        })}

      {/* FORFEIT BANNER */}
      {pickedCount > 0 ? (
        <div className="tracker-card" style={{ borderColor: `${COL.red}55`, marginBottom: 10, overflow: "hidden" }}>
          <div style={{ padding: "12px 14px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div style={{ display: "flex", alignItems: "baseline", gap: 8, flexWrap: "wrap" }}>
              <span style={{ fontSize: 14, color: "#eca1a7", fontWeight: 750, textTransform: "uppercase", letterSpacing: 1.5 }}>{forfeitReady ? "Forfeit locked" : "Forfeit building"}</span>
              <span style={{ fontSize: 11, color: COL.sil, fontWeight: 500 }}>{pickedCount}/{FORFEIT_CATS.length} pieces · winner of each round picks</span>
            </div>
            {roundCount >= 1 && <div style={{ display: "flex", alignItems: "center", gap: 6 }}><Avatar name={lastPlace.name} size={22} /><span style={{ fontSize: 10, color: COL.w, fontWeight: 500 }}>{shortName(lastPlace.name)}</span></div>}
          </div>
          <div style={{ color: COL.w }}>
            {filledCats.map(sec => {
              const pickers = forfeitPickers(sec.pickIdx);
              return (
              <div key={sec.key} style={{ padding: "7px 14px", borderTop: "1px solid #ffffff15", display: "flex", alignItems: "flex-start", gap: 8 }}>
                <span style={{ fontSize: 10, background: "rgba(157,72,80,.2)", color: "#eca1a7", padding: "2px 6px", borderRadius: 4, fontWeight: 700, minWidth: 38, textAlign: "center", flexShrink: 0 }}>#{sec.pickIdx}</span>
                <span style={{ fontSize: 14, lineHeight: 1.2, flexShrink: 0 }}>{sec.icon}</span>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 9, color: "#eca1a7", textTransform: "uppercase", letterSpacing: 0.5 }}>{sec.label}</div>
                  <div style={{ fontSize: 12, fontWeight: 500, lineHeight: 1.35 }}>{sec.picks.join(" + ")}</div>
                  {pickers.length > 0 && <div style={{ display: "flex", alignItems: "center", gap: 4, marginTop: 4, fontSize: 9, color: COL.sil }}>
                    <span>picked by</span>
                    {pickers.map(p => <span key={p} style={{ display: "inline-flex", alignItems: "center", gap: 3 }}>
                      <Avatar name={p} size={14} />
                      <span style={{ color: COL.w, fontWeight: 600 }}>{shortName(p)}</span>
                    </span>)}
                  </div>}
                </div>
              </div>
              );
            })}
          </div>
          <div style={{ padding: "10px 14px", borderTop: "1px solid #ffffff15" }}>
            <div style={{ background: "rgba(255,255,255,.1)", borderRadius: 3, height: 6, overflow: "hidden" }}>
              <div style={{ height: "100%", width: `${Math.round((pickedCount / FORFEIT_CATS.length) * 100)}%`, background: COL.red, borderRadius: 3, transition: "width 0.5s" }} />
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 9, color: "#eca1a7", marginTop: 4 }}>
              <span>{pickedCount} of {FORFEIT_CATS.length} pieces picked</span>
              <span>{forfeitReady ? "LOCKED IN" : nextForfeitCat && nextForfeitCat.pickIdx <= visibleCount ? `Pending: ${(forfeitPickers(nextForfeitCat.pickIdx)[0] && shortName(forfeitPickers(nextForfeitCat.pickIdx)[0])) || "winner"} to pick ${nextForfeitCat.label}` : nextForfeitCat ? `Pick ${nextForfeitCat.pickIdx} unlocks after R${nextForfeitCat.pickIdx} is entered` : ""}</span>
            </div>
          </div>
        </div>
      ) : (
        <div style={{ ...cardStyle, textAlign: "center", padding: 16 }}>

          </div>
          {visibleCats.map(cat => {
            const picked = cat.picks;

            return <div key={cat.key} style={{ padding: "12px 14px", borderBottom: "1px solid rgba(143,161,196,.14)", background: isNext ? "rgba(210,169,46,.08)" : "transparent" }}>

        <button onClick={() => {

          const lockedTeams = nextRoundLock && nextRoundLock.teams ? nextRoundLock.teams : null;
          const teams = lockedTeams || suggestedTeams;

          }} style={{ width: "100%", padding: 12, fontSize: 14, fontWeight: 500, cursor: "pointer", background: COL.navy, color: COL.w, border: "none", borderRadius: 8, marginTop: 6 }}>Enter round {roundCount + 1}{isTeamRound ? " (TEAMS)" : ""}</button>
      </div>}

      {/* ===== COURSES ===== */}
      {view === "courses" && !pickFor && !profileFor && <div>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
          <div>
            <div className="section-heading">Course picks</div>
            <div style={{ display: "flex", gap: 4, marginTop: 3 }}>
              <span className="tracker-chip">{COURSE_PICK_LIMIT} picks each</span>
              <span className="tracker-chip gold">R11 + R12 locked for Barnbougle</span>
            </div>
          </div>
          <button onClick={() => setAddingCourse(true)} style={{ fontSize: 10, padding: "3px 8px", cursor: "pointer", background: COL.navy, color: COL.w, border: "none", borderRadius: 4 }}>+ Add</button>
        </div>
        {addingCourse && <div style={cardStyle}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 4, marginBottom: 4 }}>

            <input placeholder="Location" value={newCourse.l} onChange={e => setNewCourse({ ...newCourse, l: e.target.value })} style={{ padding: 5, fontSize: 11 }} />
            <input placeholder="Fee $" type="number" value={newCourse.f} onChange={e => setNewCourse({ ...newCourse, f: e.target.value })} style={{ padding: 5, fontSize: 11 }} />
            <input placeholder="Drive min" type="number" value={newCourse.m} onChange={e => setNewCourse({ ...newCourse, m: e.target.value })} style={{ padding: 5, fontSize: 11 }} />
          </div>
          <div style={{ display: "flex", gap: 4 }}>
            <button onClick={() => { if (!newCourse.n) return; save({ ...data, custom: [...(data.custom || []), { id: 100 + (data.custom || []).length, n: newCourse.n, l: newCourse.l, f: +newCourse.f || 0, m: +newCourse.m || 30, p: 72, h: 18, d: 3, t: "Custom" }] }); setNewCourse({ n: "", l: "", f: "", m: "" }); setAddingCourse(false); }} style={{ fontSize: 10, padding: "4px 10px", cursor: "pointer", background: COL.navy, color: COL.w, border: "none", borderRadius: 4 }}>Add</button>
            <button onClick={() => setAddingCourse(false)} style={{ fontSize: 10, padding: "4px 10px", cursor: "pointer" }}>Cancel</button>
          </div>
        </div>}
        <div className="tracker-card" style={{ overflow: "hidden" }}>
        {PLAYERS.map((p, pi) => <div key={p} style={{ marginBottom: 0, padding: pi > 0 ? "12px 12px 10px" : "12px 12px 10px", borderBottom: pi < 3 ? "1px solid rgba(143,161,196,.14)" : "none" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
            <Avatar name={p} size={24} />
            <span style={{ fontSize: 12, fontWeight: 500, flex: 1 }}>{p} ({((data.picks || {})[p] || []).length}/{COURSE_PICK_LIMIT})</span>
            <button onClick={() => setPickFor(p)} style={{ fontSize: 10, padding: "4px 10px", cursor: "pointer", background: COL.navy, color: COL.w, border: "none", borderRadius: 6 }}>

            </button>
          </div>
          <div style={{ display: "flex", gap: 3, flexWrap: "wrap", marginLeft: 30 }}>
            {((data.picks || {})[p] || []).map(cid => {
              const c = allCourses.find(x => x.id === cid);
              const done = (data.rounds || []).some(r => r.courseId === cid);
              return <div key={cid} style={{ fontSize: 10, padding: "2px 7px", borderRadius: 10, border: "1px solid rgba(143,161,196,.26)", background: "rgba(255,255,255,.04)", color: COL.sil, textDecoration: done ? "line-through" : "none", opacity: done ? 0.4 : 1 }}>{c ? c.n : "?"}</div>;
            })}
          </div>
        </div>)}
        </div>
        {/* R11 + R12 locked */}
        <div className="tracker-card" style={{ padding: 12, marginTop: 10, display: "flex", gap: 8 }}>
          <div style={{ flex: 1, padding: "6px 8px", borderRadius: 6, background: COL.nm, textAlign: "center" }}>

            <div style={{ fontSize: 12, fontWeight: 500, color: COL.w }}>Lost Farm</div>
            <div style={{ fontSize: 8, color: COL.sil }}>Locked</div>
          </div>
          <div style={{ flex: 1, padding: "6px 8px", borderRadius: 6, background: COL.gold + "20", border: `1px solid ${COL.gold}40`, textAlign: "center" }}>

            <div style={{ fontSize: 12, fontWeight: 500, color: COL.gold }}>Barnbougle Dunes</div>
            <div style={{ fontSize: 8, color: COL.sil }}>Locked</div>
          </div>
        </div>
      </div>}

      {view === "courses" && pickFor && !profileFor && <div>
        <div className="tracker-card" style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10, padding: 12 }}>

          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 13, fontWeight: 500 }}>{pickFor}</div>
            <div style={{ fontSize: 10, color: COL.sil }}>{((data.picks || {})[pickFor] || []).length}/{COURSE_PICK_LIMIT}</div>
          </div>
          <button onClick={() => setPickFor(null)} style={{ fontSize: 11, padding: "6px 16px", cursor: "pointer", background: COL.navy, color: COL.w, border: "none", borderRadius: 6, fontWeight: 500 }}>Done</button>

        {[
          { label: "Quick (< 30 min)", filter: c => c.m <= 30 },
          { label: "Day trip (30-60 min)", filter: c => c.m > 30 && c.m <= 60 },

          return <div key={cat.label}>
            <div className="tracker-kicker" style={{ margin: "14px 0 6px", paddingBottom: 4, borderBottom: "1px solid rgba(143,161,196,.16)" }}>{cat.label}</div>

              return <div key={c.id} onClick={() => !disabled && toggleCourse(pickFor, c.id)} style={{
                padding: "8px 10px", marginBottom: 3, borderRadius: 8,

                color: COL.w,
                border: selected ? `1.5px solid #5b83ff` : "1px solid rgba(143,161,196,.18)",

                <div style={{ display: "flex", justifyContent: "space-between" }}>
                  <div style={{ flex: 1 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 4, flexWrap: "wrap" }}>
                      <span style={{ fontSize: 12, fontWeight: 500 }}>{c.n}</span>
                      {c.x && <span style={{ fontSize: 8, padding: "1px 5px", borderRadius: 8, background: COL.gold + "20", color: COL.gold }}>Top 100</span>}
                      {c.h === 9 && <span style={{ fontSize: 8, padding: "1px 5px", borderRadius: 8, background: COL.grn + "20", color: COL.grn }}>9h</span>}
                      <TimeTag mins={c.m} />
                    </div>
                    <div style={{ fontSize: 10, color: COL.sil, marginTop: 1 }}>{c.l} · Par {c.p} · <DiffDots level={c.d} /></div>
                  </div>
                  <div style={{ fontSize: 14, fontWeight: 500 }}>${c.f}</div>
                </div>
                {taken && <div style={{ fontSize: 9, color: COL.sil, marginTop: 1 }}>Taken by {taken}</div>}
              </div>;
            })}
          </div>;
        })}
